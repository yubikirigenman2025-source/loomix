<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="Karotter / Yudetter / あめ→はれ / Pitter / Amiverse のタイムラインをひとつの流れに。">
<title>Loomix</title>
<link rel="stylesheet" href="style.css?v=062">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Cpath d='M14 20h36M14 32h36M14 44h36' stroke='%23bbb' stroke-width='2'/%3E%3C/svg%3E">
</head>
<body>

<!-- ================================================================ トップ（ゲート） -->
<div class="gate" id="gate" hidden>
  <div class="gate-wrap">

    <header class="gate-head">
      <h1 class="gate-brand">Loomix</h1>
      <a class="gate-preview-link" href="#/preview">プレビューを見る</a>
    </header>

    <section class="gate-main">
      <!-- 横スワイプ ログインカード セクション -->
      <div class="swipe-section" aria-label="ログインするSNSの選択">
        <div class="swipe-section-header">
          <div class="swipe-controls">
            <button class="swipe-btn" id="swipePrev" type="button" aria-label="前のSNS">‹</button>
            <button class="swipe-btn" id="swipeNext" type="button" aria-label="次のSNS">›</button>
          </div>
        </div>

        <!-- スワイプ可能なカードコンテナ -->
        <div class="swipe-track" id="swipeTrack" tabindex="0" role="region" aria-label="SNSログインカード一覧"></div>

        <!-- インジケータードット -->
        <div class="swipe-dots" id="swipeDots" role="tablist" aria-label="SNSカード切り替え"></div>
      </div>

      <p class="gate-notice" id="gateNotice" hidden></p>
    </section>

    <footer class="gate-foot">
      <span id="gateStatus">連携状況を確認しています</span>
    </footer>

  </div>
</div>

<!-- ================================================================ 本体 -->
<div class="shell" id="app" hidden>

  <aside class="sidebar">
    <a class="side-brand" href="#/home">
      <span class="brand-name">Loomix</span>
      <span class="brand-ver">0.5</span>
    </a>
    <nav class="side-nav" aria-label="メイン">
      <a class="nav-item" href="#/home" data-route="home">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 10.6 12 4l8 6.6V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg>
        <span>ホーム</span>
      </a>
      <a class="nav-item" href="#/profile" data-route="profile">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.5 20c1.3-3.7 4-5.6 7.5-5.6s6.2 1.9 7.5 5.6"/></svg>
        <span>プロフィール</span>
      </a>
      <a class="nav-item" href="#/settings" data-route="settings">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h9M19 7h1M4 17h2M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg>
        <span>設定</span>
      </a>
    </nav>
    <div class="side-user" id="sideUser"></div>
  </aside>

  <div class="main">

    <header class="top">
      <div class="top-inner">
        <h1 class="top-title" id="topTitle">ホーム</h1>
        <div class="top-tools" id="topTools">
          <label class="auto" title="返信を除いて表示">
            <input type="checkbox" id="hideReplies">
            <span class="box" aria-hidden="true"></span>
            <span>返信除外</span>
          </label>
          <label class="auto" title="60秒ごとに更新">
            <input type="checkbox" id="autoRefresh" checked>
            <span class="box" aria-hidden="true"></span>
            <span>自動更新</span>
          </label>
          <button id="refreshBtn" class="btn" type="button">更新</button>
        </div>
      </div>
    </header>

    <section class="view" id="view-home">
      <main class="feed" id="feed" aria-live="polite"></main>

      <div class="feed-end" id="feedEnd" hidden>
        <p class="loading-line" id="loadingLine" hidden>読み込み中...</p>
        <button class="more" id="moreBtn" type="button" hidden>さらに読み込む</button>
        <p class="stamp" id="stamp"></p>
        <p class="updated" id="statusLine"></p>
      </div>

      <div class="empty" id="empty" hidden>該当する投稿がありません</div>
    </section>

    <section class="view" id="view-profile" hidden></section>
    <section class="view" id="view-settings" hidden></section>

  </div>

  <nav class="mobile-nav" aria-label="メイン">
    <a href="#/home" data-route="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 10.6 12 4l8 6.6V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg>
      <span>ホーム</span>
    </a>
    <a href="#/profile" data-route="profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.5 20c1.3-3.7 4-5.6 7.5-5.6s6.2 1.9 7.5 5.6"/></svg>
      <span>プロフィール</span>
    </a>
    <a href="#/settings" data-route="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h9M19 7h1M4 17h2M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg>
      <span>設定</span>
    </a>
  </nav>

</div>

<!-- プロフィール（スライドオーバー） -->
<div class="backdrop" id="backdrop" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden>
  <div class="drawer-head">
    <h2 id="drawerTitle">プロフィール</h2>
    <button class="close" id="drawerClose" type="button">閉じる</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<!-- 画像拡大 -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="画像" hidden>
  <div class="lb-bar">
    <span id="lbCount"></span>
    <button class="close" id="lbClose" type="button">閉じる</button>
  </div>
  <button class="lb-nav prev" id="lbPrev" type="button" aria-label="前の画像">‹</button>
  <div class="lb-stage" id="lbStage">
    <img id="lbImg" alt="">
  </div>
  <button class="lb-nav next" id="lbNext" type="button" aria-label="次の画像">›</button>
</div>

<div class="toast" id="toast" hidden></div>

<script src="app.js?v=062"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="Karotter / Yudetter / あめ→はれ / Pitter の公開タイムラインをひとつの流れに。">
<title>Loomix</title>
<link rel="stylesheet" href="style.css?v=030">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Cpath d='M14 20h36M14 32h36M14 44h36' stroke='%23bbb' stroke-width='2'/%3E%3C/svg%3E">
</head>
<body>
<div class="app">

  <header class="top">
    <div class="top-inner">
    <div class="brand">
      <span class="brand-name">Loomix</span>
      <span class="brand-ver">0.3</span>
    </div>
    <div class="top-tools">
      <label class="auto" title="60秒ごとに更新">
        <input type="checkbox" id="autoRefresh" checked>
        <span class="box" aria-hidden="true"></span>
        <span>自動更新</span>
      </label>
      <button id="refreshBtn" class="btn" type="button">更新</button>
    </div>
    </div>
  </header>

  <nav class="filters" aria-label="サービス絞り込み">
    <div class="filters-inner">
    <div class="filter-scroll" id="filterBar">
      <button class="tab is-active" type="button" data-service="all" aria-pressed="true">
        すべて<span class="n" id="count-all"></span>
      </button>
      <button class="tab" type="button" data-service="karotter" aria-pressed="false">
        karotter<span class="n" id="count-karotter"></span>
      </button>
      <button class="tab" type="button" data-service="yudetter" aria-pressed="false">
        yudetter<span class="n" id="count-yudetter"></span>
      </button>
      <button class="tab" type="button" data-service="amehare" aria-pressed="false">
        am-hr<span class="n" id="count-amehare"></span>
      </button>
      <button class="tab" type="button" data-service="pitter" aria-pressed="false">
        pitter<span class="n" id="count-pitter"></span>
      </button>
    </div>
    <label class="reply-filter" title="返信を除いて表示">
      <input type="checkbox" id="hideReplies">
      <span class="box" aria-hidden="true"></span>
      <span>返信を除外</span>
    </label>
    </div>
  </nav>

  <main class="feed" id="feed" aria-live="polite"></main>

  <div class="feed-end" id="feedEnd" hidden>
    <p class="loading-line" id="loadingLine" hidden>読み込み中...</p>
    <button class="more" id="moreBtn" type="button" hidden>さらに読み込む</button>
    <p class="stamp" id="stamp"></p>
  </div>

  <div class="empty" id="empty" hidden>該当する投稿がありません</div>

  <footer class="foot">
    <div class="foot-inner">
      <span>Loomix 0.3</span>
      <span id="statusLine">読み込み中</span>
    </div>
  </footer>

</div>

<!-- プロフィール（スライドオーバー） -->
<div class="backdrop" id="backdrop" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden>
  <div class="drawer-head">
    <h2 id="drawerTitle">プロフィール</h2>
    <button class="close" id="drawerClose" type="button">閉じる</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<!-- 画像拡大 -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="画像" hidden>
  <div class="lb-bar">
    <span id="lbCount"></span>
    <button class="close" id="lbClose" type="button">閉じる</button>
  </div>
  <button class="lb-nav prev" id="lbPrev" type="button" aria-label="前の画像">‹</button>
  <div class="lb-stage" id="lbStage">
    <img id="lbImg" alt="">
  </div>
  <button class="lb-nav next" id="lbNext" type="button" aria-label="次の画像">›</button>
</div>

<script src="app.js?v=030"></script>
</body>
</html>
